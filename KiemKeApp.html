<style>
:root {
  --brand: #F26522; --brand-dark: #C94E12; --brand-soft: #FFF1E8;
  --ok: #12805C; --ok-soft: #E3F5EC; --warn: #A15C07; --warn-soft: #FEF3C7;
  --bad: #C2410C; --bad-soft: #FFEDD5; --miss: #B91C1C; --miss-soft: #FEE2E2;
  --ink: #1F2328; --ink-2: #59636E; --ink-3: #8A939C; --line: #E4E7EB; --bg: #F4F5F7; --card: #FFFFFF;
  --r: 14px; --nav: 64px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Khung ---------- */
.top { position: sticky; top: 0; z-index: 10; background: var(--brand); color: #fff;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
.top-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 10px; }
.top h1 { font-size: 17px; margin: 0; flex: 1; font-weight: 700; }
.who { font-size: 12px; opacity: .92; text-align: right; line-height: 1.25; }
.badge { background: #fff; color: var(--brand-dark); border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 700; }
main { max-width: 720px; margin: 0 auto; padding: 14px 16px calc(var(--nav) + env(safe-area-inset-bottom) + 20px); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom); }
.nav-in { max-width: 720px; margin: 0 auto; display: flex; }
.nav button { flex: 1; height: var(--nav); border: 0; background: none; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; color: var(--ink-3); }
.nav button svg { width: 23px; height: 23px; }
.nav button.on { color: var(--brand); font-weight: 600; }

/* ---------- Thanh phan chung ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-bottom: 12px; }
.h2 { font-size: 16px; font-weight: 700; margin: 4px 2px 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.h2 small { font-weight: 400; color: var(--ink-2); font-size: 13px; }
.btn { height: 46px; border: 0; border-radius: 12px; font-weight: 600; padding: 0 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn svg { width: 20px; height: 20px; }
.btn.primary { background: var(--brand); color: #fff; } .btn.primary:active { background: var(--brand-dark); }
.btn.light { background: var(--card); border: 1px solid var(--line); }
.btn.dark { background: #2a2d31; color: #fff; }
.btn.ok { background: var(--ok); color: #fff; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .55; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
.field input, .field select, .inp { width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 10px;
  padding: 0 12px; background: var(--card); }
.field input[type=date] { -webkit-appearance: none; appearance: none; min-width: 0; display: block; font-size: 15px; text-align: left; }
.field input[type=date]::-webkit-date-and-time-value { text-align: left; }
.field input:focus, .field select:focus, .inp:focus { outline: 2px solid var(--brand); border-color: transparent; }
.hint { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }
.err { color: var(--miss); font-size: 13.5px; min-height: 19px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { min-width: 0; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 10px; scrollbar-width: none; }
.chip { flex: none; height: 34px; border-radius: 999px; border: 1px solid var(--line); background: var(--card);
  padding: 0 13px; font-size: 13.5px; }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.empty { text-align: center; color: var(--ink-2); padding: 30px 12px; }
.tag { display: inline-flex; align-items: center; font-size: 12px; border-radius: 6px; padding: 1px 7px; background: var(--bg); color: var(--ink-2); }
.tag.ok { background: var(--ok-soft); color: var(--ok); } .tag.miss { background: var(--miss-soft); color: var(--miss); }
.tag.bad { background: var(--bad-soft); color: var(--bad); } .tag.dup { background: var(--warn-soft); color: var(--warn); }

/* ---------- Thong ke ---------- */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 4px; text-align: center;
  cursor: pointer; font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
.stat:active { transform: scale(.97); } .stat.on { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
.otp { display: block; width: 100%; box-sizing: border-box; height: 54px; padding: 0 10px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--card); color: var(--ink); font: inherit; font-size: 26px !important; letter-spacing: 10px; text-align: center;
  font-variant-numeric: tabular-nums; font-weight: 700; margin-bottom: 8px; }
.otp:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(242,101,34,.18); }
a.btn { text-decoration: none; display: flex; align-items: center; justify-content: center; }
.steps { display: flex; gap: 6px; margin: 4px 0 16px; }
.steps div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-3); }
.steps b { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--line); color: var(--ink-2); font-size: 13px; }
.steps .on b { background: var(--brand); color: #fff; } .steps .on { color: var(--ink); font-weight: 600; }
.steps .done b { background: var(--ok); color: #fff; }
.who { display: flex; flex-direction: column; gap: 2px; text-align: left; background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
.who span { font-size: 13px; color: var(--ink-2); }
.selfie { position: relative; width: 100%; max-width: 300px; aspect-ratio: 3 / 4; margin: 0 auto; border-radius: 16px; overflow: hidden; background: #111; }
.selfie video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.selfie .ring { position: absolute; inset: 9% 14% 16%; border: 3px dashed rgba(255,255,255,.75); border-radius: 50% / 45%; pointer-events: none; }
.selfie .cd { position: absolute; inset: 0; display: grid; place-items: center; font-size: 72px; font-weight: 800; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.6); pointer-events: none; }
.selfie img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #111; }
.guide { padding-left: 20px; margin: 0 0 10px; font-size: 14px; line-height: 1.5; } .guide li { margin-bottom: 10px; }
.or { text-align: center; font-size: 12px; color: var(--ink-3); margin: 8px 0 6px; }
.qr { width: 190px; margin: 0 auto; background: #fff; border-radius: 10px; padding: 4px; } .qr svg { width: 100%; height: auto; display: block; }
.key { display: flex; gap: 8px; align-items: center; } .key code { flex: 1; font-size: 13.5px; background: var(--bg); padding: 9px 10px; border-radius: 8px; word-break: break-all; letter-spacing: .5px; }
.key .btn { height: 38px; padding: 0 12px; }
.selfthumb { width: 96px; height: 64px; border-radius: 8px; background: #111 center/cover no-repeat; flex: none; }
.hubsel { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.hubsel label { font-size: 13px; font-weight: 600; white-space: nowrap; }
.hubsel select { flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card);
  font: inherit; font-size: 14.5px; color: var(--ink); }
.fbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.fsum { font-size: 12.5px; color: var(--ink-2); flex-basis: 100%; }
.fpanel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; background: var(--card); border: 1px solid var(--line);
  border-radius: var(--r); padding: 12px; margin-bottom: 10px; }
.fpanel .fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.fpanel .fld:last-child { grid-column: 1 / -1; }
.fpanel label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.fpanel select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); font: inherit; font-size: 14px; color: var(--ink); }
@media (max-width: 380px) { .fpanel { grid-template-columns: 1fr; } }
/* Thanh tien do: uoc luong % theo thoi gian, nhay 100% khi xong */
.ld { padding: 26px 8px; text-align: center; color: var(--ink-2); font-size: 13.5px; }
.ld.sm { padding: 2px 0 10px; font-size: 12.5px; }
.ld .lt { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.ld .lt b { color: var(--brand); font-variant-numeric: tabular-nums; }
.ldbar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; position: relative; }
.ld.sm .ldbar { height: 5px; }
.ldbar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; transition: width .3s ease-out;
  background: linear-gradient(90deg, var(--brand), #FF9A5C, var(--brand)); background-size: 200% 100%; animation: ldShine 1.2s linear infinite; }
@keyframes ldShine { from { background-position: 200% 0; } to { background-position: 0 0; } }
#topbar { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 60; pointer-events: none; opacity: 0; transition: opacity .2s; }
#topbar.on { opacity: 1; } #topbar i { display: block; height: 100%; width: 40%; background: var(--brand); animation: topRun 1.1s ease-in-out infinite; }
@keyframes topRun { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
.dettog { display: flex; width: 100%; justify-content: space-between; align-items: center; margin: 14px 0 8px; padding: 12px 14px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r); font: inherit; font-weight: 700; font-size: 15px; color: var(--ink); cursor: pointer; }
.dettog small { font-weight: 500; color: var(--ink-2); }
.hubtag { font-weight: 600; color: var(--ink); }
.st { display: inline-flex; align-items: center; font-size: 12.5px; font-weight: 700; border-radius: 6px; padding: 2px 8px; color: #fff; }
.st.go { background: #0B6E3F; } .st.other { background: #B45309; }
.order.click { cursor: pointer; } .order.click:active { background: var(--bg); }
/* Popup giua man hinh */
.sheet-bg.center { align-items: center; justify-content: center; padding: 16px; }
.sheet-bg.center .sheet { border-radius: 16px; max-width: 440px; max-height: calc(100vh - 32px); max-height: calc(100dvh - 32px);
  padding: 18px 16px 16px; box-shadow: 0 20px 50px rgba(0,0,0,.3); animation: popIn .16s ease-out; }
@keyframes popIn { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet .x { float: right; margin: -6px -4px 0 8px; width: 34px; height: 34px; border: 0; border-radius: 50%; background: var(--bg);
  font-size: 20px; line-height: 1; color: var(--ink-2); cursor: pointer; }
.od { display: grid; grid-template-columns: 96px 1fr; gap: 8px 10px; font-size: 14px; margin: 8px 0 14px; }
.od dt { color: var(--ink-2); } .od dd { margin: 0; font-weight: 500; white-space: pre-line; word-break: break-word; }
.od .fails { font-weight: 400; background: var(--bg); border-radius: 8px; padding: 8px 10px; }
.closedline { display: block; width: 100%; text-align: center; font-size: 12.5px; color: var(--ink-2); background: none; border: 0;
  padding: 2px 0 8px; cursor: pointer; font-family: inherit; } .closedline b { color: var(--ink); }
.stat b { display: block; font-size: 22px; line-height: 1.15; }
.stat span { font-size: 11.5px; color: var(--ink-2); }
.stat.ok b { color: var(--ok); } .stat.miss b { color: var(--miss); } .stat.bad b { color: var(--bad); }
.bar { height: 7px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
.bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .3s; }

/* ---------- May quet ---------- */
.scanner { position: relative; background: #0d0f11; border-radius: var(--r); overflow: hidden; margin-bottom: 12px; }
#reader { width: 100%; }
#reader video { width: 100% !important; display: block; object-fit: cover; }
#reader img[alt="Info icon"], #reader__dashboard { display: none !important; }
.scan-idle { padding: 34px 18px 24px; text-align: center; color: #cfd4da; }
.scan-idle svg { width: 46px; height: 46px; color: var(--brand); margin-bottom: 8px; }
.scan-bar { display: flex; gap: 8px; padding: 10px; }
.scan-bar .btn.primary { flex: 1; }
.scan-hint { position: absolute; left: 10px; right: 10px; top: 10px; text-align: center; color: #fff; font-size: 13px;
  text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none; }
.reading { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,.65); color: #fff;
  padding: 6px 12px; border-radius: 999px; font-size: 13px; pointer-events: none; }

/* ---------- The don ---------- */
.order { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--line);
  border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
.order.miss { border-left-color: var(--miss); } .order.ok { border-left-color: var(--ok); }
.order.bad { border-left-color: var(--bad); } .order.dup { border-left-color: var(--warn); }
.order .body { flex: 1; min-width: 0; }
.o1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.ocode { font-weight: 700; letter-spacing: .3px; word-break: break-all; }
.cod { font-weight: 700; color: var(--brand-dark); white-space: nowrap; }
.sub { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.thumb { width: 64px; height: 64px; border-radius: 10px; background: var(--bg) center/cover no-repeat; flex: none; border: 1px solid var(--line); }
.thumb.click { cursor: zoom-in; }

/* ---------- Bang bao cao ---------- */
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 12px; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; }
.kpi span { font-size: 12.5px; color: var(--ink-2); } .kpi b { display: block; font-size: 22px; }
.kpi.miss b { color: var(--miss); } .kpi.ok b { color: var(--ok); }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 14px; }
.tbl th, .tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; white-space: normal; min-width: 130px; }
.tbl th { font-size: 12px; color: var(--ink-2); font-weight: 600; background: #FAFBFC; position: sticky; top: 0; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.hl td { background: var(--miss-soft); }
.tbl .nm { font-weight: 600; } .tbl .k { font-size: 12px; color: var(--ink-3); }

/* ---------- Lop phu ---------- */
.sheet-bg { position: fixed; inset: 0; background: rgba(12,14,16,.6); z-index: 30; display: flex; align-items: flex-end; }
.sheet { background: var(--card); width: 100%; max-width: 720px; margin: 0 auto; border-radius: 18px 18px 0 0;
  padding: 16px 16px calc(env(safe-area-inset-bottom) + 16px); max-height: 92vh; overflow-y: auto; }
.sheet h3 { margin: 0 0 10px; font-size: 18px; }
.confirm-img { width: 100%; border-radius: 12px; display: block; background: #000; max-height: 46vh; object-fit: contain; }
.result { border-radius: 12px; padding: 11px 13px; margin: 12px 0; border: 1px solid; }
.result b { font-size: 17px; }
.result.ok { background: var(--ok-soft); border-color: #A7DDC4; color: #0B5A41; }
.result.bad { background: var(--bad-soft); border-color: #FDC9A0; color: #8A2E0A; }
.result.dup { background: var(--warn-soft); border-color: #F8DC8A; color: #6E3A05; }
.viewer { position: fixed; inset: 0; background: #000; z-index: 40; display: flex; flex-direction: column; }
.viewer-top { display: flex; align-items: center; gap: 10px; color: #fff; padding: calc(env(safe-area-inset-top) + 8px) 12px 8px; }
.viewer-top .t { flex: 1; font-size: 13.5px; line-height: 1.3; }
.viewer-img { flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; touch-action: pinch-zoom pan-x pan-y; }
.viewer-img img { max-width: 100%; max-height: 100%; }
.viewer-img.zoom img { max-width: none; max-height: none; width: 220%; }
.icon-btn { width: 40px; height: 40px; border: 0; border-radius: 10px; background: rgba(255,255,255,.16); color: #fff;
  display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 22px; height: 22px; }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav) + env(safe-area-inset-bottom) + 14px); transform: translateX(-50%);
  background: #23272b; color: #fff; padding: 10px 14px; border-radius: 10px; font-size: 14px; z-index: 50; max-width: 92vw; display: none; }
.toast.show { display: block; }
.spin { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,.5); border-top-color: #fff; border-radius: 50%; animation: sp .7s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }

/* ---------- Dang nhap ---------- */
.login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: var(--brand); }
.login .card { width: 100%; max-width: 400px; padding: 22px 18px; }
.login h1 { margin: 0 0 4px; font-size: 22px; } .login p { margin: 0 0 18px; color: var(--ink-2); }
.demo { background: var(--warn-soft); color: #6E3A05; border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
.hubpick { max-height: 220px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px; }
.hubpick label { display: flex; gap: 8px; align-items: center; padding: 7px 0; font-weight: 400; margin: 0; border-bottom: 1px solid var(--line); }
.hubpick label:last-child { border-bottom: 0; }
.hubpick input[type=checkbox] { width: 20px; height: 20px; flex: none; margin: 0; accent-color: var(--brand); }
.seg { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { flex: 1; height: 36px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; }
.seg button.on { background: var(--card); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
</style>

<script>
(function () {

// =====================================================================

const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const ICON = {

  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',

// TOTP (RFC 6238) tren trinh duyet - chi dung cho che do demo
const B32 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
function b32enc(bytes) { let bits = 0, val = 0, out = ''; bytes.forEach(b => { val = (val << 8) | b; bits += 8;
  while (bits >= 5) { out += B32[(val >>> (bits - 5)) & 31]; bits -= 5; } }); if (bits > 0) out += B32[(val << (5 - bits)) & 31]; return out; }
function b32dec(s) { let bits = 0, val = 0; const out = []; s.replace(/[^A-Z2-7]/g, '').split('').forEach(ch => { val = (val << 5) | B32.indexOf(ch); bits += 5;
  if (bits >= 8) { out.push((val >>> (bits - 8)) & 255); bits -= 8; } }); return new Uint8Array(out); }
async function totpAt(secret, counter) {
  const key = await crypto.subtle.importKey('raw', b32dec(secret), { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
  const msg = new Uint8Array(8); let c = counter; for (let i = 7; i >= 0; i--) { msg[i] = c % 256; c = Math.floor(c / 256); }
  const h = new Uint8Array(await crypto.subtle.sign('HMAC', key, msg)), o = h[19] & 15;
  return String((((h[o] & 127) << 24) | (h[o + 1] << 16) | (h[o + 2] << 8) | h[o + 3]) % 1e6).padStart(6, '0');
}
async function totpOk(secret, code) { const c = Math.floor(Date.now() / 30000);
  for (let d = -1; d <= 1; d++) if (await totpAt(secret, c + d) === String(code)) return true; return false; }

const Q = (function () {
  let dbp = null;
  const db = () => dbp || (dbp = new Promise((ok, no) => {
    const r = indexedDB.open('kiemke', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('queue', { keyPath: 'id' });
    r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
  }));
  const tx = async (mode, fn) => { const d = await db(); return new Promise((ok, no) => {
    const t = d.transaction('queue', mode), s = t.objectStore('queue'); const res = fn(s);
    t.oncomplete = () => ok(res && res.result); t.onerror = () => no(t.error); }); };
  return {
    add: item => tx('readwrite', s => s.put(item)).catch(() => { Q.mem.push(item); }),
    del: id => tx('readwrite', s => s.delete(id)).catch(() => { Q.mem = Q.mem.filter(x => x.id !== id); }),
    all: () => tx('readonly', s => s.getAll()).then(x => (x || []).concat(Q.mem)).catch(() => Q.mem.slice()),
    mem: []
  };
})();

// Chup 3 khung hinh trong 3 giay, ghep thanh 1 anh ngang, in ma NV + gio len anh
async function shootSelfie() {
  const v = $('#eVid'); if (!v || !v.videoWidth) { $('#eErr').textContent = 'Camera chưa sẵn sàng, đợi 1 giây rồi bấm lại'; return; }
  $('#eShoot').disabled = true;
  const W = 300, H = 400, frames = [];
  for (let i = 0; i < 3; i++) {
    $('#eCd').textContent = 3 - i;
    await new Promise(r => setTimeout(r, i ? 1000 : 400));
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const vw = v.videoWidth, vh = v.videoHeight, sw = Math.min(vw, vh * W / H), sh = sw * H / W;
    const x = c.getContext('2d'); x.translate(W, 0); x.scale(-1, 1);
    x.drawImage(v, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, W, H); frames.push(c);
  }
  $('#eCd').textContent = '';
  const out = document.createElement('canvas'); out.width = W * 3; out.height = H + 64;
  const g = out.getContext('2d'); g.fillStyle = '#111'; g.fillRect(0, 0, out.width, out.height);
  frames.forEach((f, i) => g.drawImage(f, i * W, 0));
  g.fillStyle = '#F26522'; g.fillRect(0, H, out.width, 64);
  g.fillStyle = '#fff'; g.font = 'bold 22px system-ui, sans-serif';
  g.fillText('Mã NV ' + EN.start.ma + (EN.start.ten ? ' · ' + EN.start.ten : ''), 14, H + 27);
  g.font = '18px system-ui, sans-serif';
  g.fillText('Xác minh kích hoạt Authenticator · ' + new Date().toLocaleString('vi-VN'), 14, H + 52);
  EN.selfie = out.toDataURL('image/jpeg', 0.8);
  stopSelfie(); renderEnroll();
}
function loadScriptOnce(srcs, ready) {
  if (ready()) return Promise.resolve();
  const one = src => new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = src;
    sc.onload = () => ready() ? ok() : no(); sc.onerror = () => { sc.remove(); no(); }; document.head.appendChild(sc); });
  return srcs.reduce((p, src) => p.catch(() => one(src)), Promise.reject());
}
async function makeQr(uri) {
  try {
    await loadScriptOnce(GAS ? ['https://quynh2011.github.io/kiemke-cod/qrcode.min.js'] : ['qrcode.min.js', 'https://quynh2011.github.io/kiemke-cod/qrcode.min.js'], () => !!window.qrcode);
    const q = qrcode(0, 'M'); q.addData(uri); q.make();
    const el = $('#eQr'); if (el) el.innerHTML = q.createSvgTag({ cellSize: 5, margin: 3, scalable: true });
  } catch (e) { const el = $('#eQr'); if (el) el.innerHTML = '<div class="hint">Không tạo được mã QR — dùng nút "Thêm vào Authenticator" hoặc nhập khoá.</div>'; }
}

// Thanh % chay: uoc luong theo thoi gian du kien (giay), tien dan toi 95%, xong thi noi dung duoc thay the
const LD = {};
function loader(text, expectSec, small, key) {

setInterval(() => {
  const live = {};

    const t = (Date.now() - LD[k]) / 1000, pct = Math.min(95, Math.round(95 * (1 - Math.exp(-t / (Number(el.dataset.exp) / 2)))));
    el.querySelector('i').style.width = pct + '%'; el.querySelector('b').textContent = pct + '%';
  });
  Object.keys(LD).forEach(k => { if (!live[k]) delete LD[k]; });
}, 200);

// Loc theo buu cuc (AM / quan ly / NV buu cuc nhieu BC)
function hubList() {
  const d = S.data || {}, m = {};
  const add = (code, name) => { if (!code) return; m[code] = m[code] || { code, name: name || '', need: 0, miss: 0 }; if (name) m[code].name = name; };
  (d.orders || []).forEach(o => { add(o.hub, o.hubName); m[o.hub].need++; if (!(d.checked || {})[o.order]) m[o.hub].miss++; });
  (d.closed || []).forEach(o => add(o.hub, o.hubName));
  (d.extra || []).forEach(o => add(o.hub, o.hubName));
  return Object.values(m).sort((a, b) => b.miss - a.miss || a.code.localeCompare(b.code));
}

// ---- Bo loc: trang thai, NV giao, so lan giao, COD, dia chi giao ----
const COD_RANGES = [['lt2', 'Dưới 2 triệu', 0, 2e6], ['2-5', '2 - 5 triệu', 2e6, 5e6], ['5-10', '5 - 10 triệu', 5e6, 1e7], ['ge10', 'Từ 10 triệu', 1e7, Infinity]];

const ATT_BUCKETS = [['0', '0 lần'], ['1', '1 lần'], ['2', '2 lần'], ['3', '3 lần'], ['4-5', 'Trên 3 lần (4–5)'], ['6-7', 'Trên 5 lần (6–7)'], ['8+', 'Trên 7 lần (8+)']];
const fAtt = o => { const n = Number(o.attempts); if (o.attempts === '' || o.attempts == null || isNaN(n)) return '?';
  return n <= 3 ? String(Math.max(0, n)) : n <= 5 ? '4-5' : n <= 7 ? '6-7' : '8+'; };
const FILTERS = [
  { k: 'status', label: 'Trạng thái đơn', val: o => o.status || '', name: v => v || '(trống)' },
  { k: 'driver', label: 'Nhân viên giao', val: o => o.driverId || o.driverName || '', name: (v, o) => (o && o.driverName ? o.driverName + ' · ' : '') + v },
  { k: 'att', label: 'Số lần giao', val: fAtt, name: v => v === '?' ? 'Không rõ' : (ATT_BUCKETS.find(b => b[0] === v) || [, v])[1] },
  { k: 'cod', label: 'COD', val: o => (COD_RANGES.find(r => o.cod >= r[2] && o.cod < r[3]) || COD_RANGES[0])[0], name: v => (COD_RANGES.find(r => r[0] === v) || [, v])[1] },
  { k: 'addr', label: 'Địa chỉ giao', val: fAddr, name: v => v || '(không rõ)' }
];
function passF(o, skip) { return FILTERS.every(F => F.k === skip || !S.f[F.k] || F.val(o) === S.f[F.k]); }
function nF() { return FILTERS.filter(F => S.f[F.k]).length; }
function dv(skipF) {
  const d = S.data || { orders: [], checked: {}, extra: [], closed: [] };
  const h = x => !S.hub || x.hub === S.hub;

  // Don Ngoai DS khong co thong tin don -> chi loc theo buu cuc; dang loc chi tiet thi an
  return Object.assign({}, d, { orders: d.orders.filter(of), extra: any ? [] : (d.extra || []).filter(h), closed: (d.closed || []).filter(of) });

function filterPanel() {
  const d = S.data || { orders: [], closed: [] };

  const sel = FILTERS.map(F => {
    // So luong theo cac bo loc con lai (bo qua chinh bo loc nay)
    const m = {};
    base.filter(o => passF(o, F.k)).forEach(o => { const v = F.val(o); m[v] = m[v] || { n: 0, o }; m[v].n++; });
    let keys = Object.keys(m);
    if (F.k === 'cod') keys = COD_RANGES.map(r => r[0]).filter(k => m[k]);
    else if (F.k === 'att') keys = ATT_BUCKETS.map(b => b[0]).concat(m['?'] ? ['?'] : []); // luon du cac moc, ke ca 0 don
    else keys.sort((a, b) => m[b].n - m[a].n || a.localeCompare(b));

      `<option value="${esc(v)}"${S.f[F.k] === v ? ' selected' : ''}>${esc(F.name(v, m[v] && m[v].o))} (${m[v] ? m[v].n : 0})</option>`).join('')}</select></div>`;
  }).join('');
  const n = nF();
  return `<div class="fbar"><button class="chip${n ? ' on' : ''}" id="fTog">Bộ lọc${n ? ' · ' + n : ''} ${S.fOpen ? '▲' : '▼'}</button>

    ${S.fOpen ? `<div class="fpanel">${sel}</div>` : ''}`;
}

// ---- Camera ----
function extractCode(raw) {
  const txt = String(raw || '').trim().toUpperCase();
  if (!txt) return '';
  if (S.byCode && S.byCode[txt]) return txt;
  if (S.byCode) for (const c in S.byCode) if (txt.indexOf(c) !== -1) return c;
  const tok = txt.split(/[^A-Z0-9]+/).filter(t => t.length >= 6 && t.length <= 20 && /[A-Z]/.test(t) && /\d/.test(t));
  if (tok.length) return tok[tok.length - 1];
  return /^[A-Z0-9]{6,20}$/.test(txt) ? txt : '';
}
async function startScan() {
  if (!window.Html5Qrcode) { toast('Không tải được bộ quét. Kiểm tra mạng rồi mở lại app.'); return; }
  if (!S.data) await loadList();
  $('#scanIdle').hidden = true;
  const F = Html5QrcodeSupportedFormats;
  if (!S.scanner) S.scanner = new Html5Qrcode('reader', {
    formatsToSupport: [F.CODE_128, F.QR_CODE, F.CODE_39, F.CODE_93, F.DATA_MATRIX],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false });
  try {
    await S.scanner.start({ facingMode: 'environment' }, {
      fps: 15, aspectRatio: 1.333,
      qrbox: (w, h) => ({ width: Math.floor(w * 0.88), height: Math.floor(Math.min(h * 0.6, w * 0.62)) }),
      videoConstraints: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1440 }, focusMode: 'continuous' }
    }, onDecode, () => {});
    S.scanning = true;
    $('#bScan').querySelector('span').textContent = 'Tắt camera';
    $('#scanHint').hidden = false;
    try { const caps = S.scanner.getRunningTrackCapabilities(); $('#bTorch').hidden = !(caps && caps.torch); } catch (e) {}
  } catch (e) {
    $('#scanIdle').hidden = false;
    toast('Không mở được camera. Cho phép quyền camera cho trang này rồi thử lại.', 6000);
  }
}
async function stopScan() {
  if (S.scanner && S.scanning) { try { await S.scanner.stop(); } catch (e) {} }
  S.scanning = false; S.torch = false; S.cand = null;
  const b = $('#bScan'); if (b) b.querySelector('span').textContent = 'Bật camera quét đơn';
  ['#bTorch', '#scanHint', '#reading'].forEach(s => { const el = $(s); if (el) el.hidden = true; });
  const i = $('#scanIdle'); if (i) i.hidden = false;
}
async function toggleTorch() {
  try { S.torch = !S.torch; await S.scanner.applyVideoConstraints({ advanced: [{ torch: S.torch }] }); } catch (e) { toast('Máy không hỗ trợ đèn'); }
}
// Chi nhan ma khi doc TRUNG 2 lan lien tiep trong 1,5 giay (chong doc nham ma vach mo)
function onDecode(text) {
  if (S.busy) return;
  const code = extractCode(text);
  if (!code) return;
  const now = Date.now();
  if (S.cool && S.cool[code] > now) return; // vua xu ly ma nay, cho nguoi kiem chuyen sang don khac
  if (!S.cand || S.cand.code !== code || now - S.cand.t > 1500) {
    S.cand = { code, raw: text, t: now, n: 1 };
    const r = $('#reading'); if (r) { r.hidden = false; r.textContent = 'Đang đọc ' + code + '…'; }
    return;
  }
  S.cand.n++; S.cand.t = now;
  if (S.cand.n < 2) return;
  const c = S.cand; S.cand = null;
  const shot = capture();
  try { S.scanner.pause(true); } catch (e) {}
  // An dong chu tieng Anh "Scanner paused" cua thu vien
  document.querySelectorAll('#reader div').forEach(el => { if (/^\s*Scanner paused\s*$/i.test(el.textContent)) el.style.display = 'none'; });
  $('#reading').hidden = true;
  beep('read');
  confirmScan(c.code, c.raw, c.n, shot);
}
// Chup khung hinh goc cua camera (do phan giai day du) + anh nho
function capture() {
  const v = document.querySelector('#reader video');
  if (!v || !v.videoWidth) return null;
  const W = v.videoWidth, H = v.videoHeight;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  c.getContext('2d').drawImage(v, 0, 0, W, H);
  const stamp = new Date().toLocaleString('vi-VN') + ' · ' + S.user.ten;
  const g = c.getContext('2d'); const fs = Math.max(18, Math.round(W / 45));
  g.font = `600 ${fs}px sans-serif`; g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, H - fs * 1.8, W, fs * 1.8);
  g.fillStyle = '#fff'; g.fillText(stamp, fs * 0.6, H - fs * 0.6);
  const full = c.toDataURL('image/jpeg', 0.88);
  const tw = 360, th = Math.round(H * tw / W);
  const t = document.createElement('canvas'); t.width = tw; t.height = th; t.getContext('2d').drawImage(c, 0, 0, tw, th);
  return { full, thumb: t.toDataURL('image/jpeg', 0.72), w: W, h: H };
}
function confirmScan(code, raw, reads, shot) {
  const d = S.data || { checked: {}, extra: [] };
  const o = S.byCode && S.byCode[code];
  const kind = !o ? 'bad' : d.checked[code] ? 'dup' : 'ok';
  const head = kind === 'ok' ? 'Có trong danh sách cần kiểm' : kind === 'dup' ? 'Đơn này đã kiểm trước đó' : 'KHÔNG có trong danh sách của bạn';
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet">
    ${shot ? `<img class="confirm-img" src="${shot.full}" alt="Ảnh đơn ${esc(code)}">` : '<div class="empty">Không chụp được ảnh, quét lại</div>'}
    <div class="result ${kind}"><div>${head}</div><b>${esc(code)}</b>
      ${o ? `<div class="sub" style="color:inherit">COD ${money(o.cod)} đ · ${esc(o.driverName || '')}<br>${esc(o.status || '')}${o.goods ? ' · ' + esc(o.goods) : ''}</div>` : ''}
      ${kind === 'dup' ? `<div class="sub" style="color:inherit">Đã kiểm lúc ${esc(d.checked[code].time)} bởi ${esc(d.checked[code].by)}</div>` : ''}
    </div>
    <div class="row"><button class="btn light" id="cRetry" style="flex:1">Quét lại</button>
      <button class="btn ${kind === 'bad' ? 'dark' : 'ok'}" id="cSave" style="flex:2" ${shot ? '' : 'disabled'}>${kind === 'bad' ? 'Ghi nhận ngoài DS' : 'Xác nhận đã kiểm'}</button></div>
    <div class="hint" style="text-align:center;margin-top:8px">Ảnh ${shot ? shot.w + '×' + shot.h : ''} · đọc khớp ${reads} lần</div></div>`;
  document.body.appendChild(bg);
  S.busy = true;
  beep(kind === 'ok' ? 'ok' : kind === 'dup' ? 'dup' : 'bad');
  const close = () => {
    bg.remove(); S.busy = false;
    S.cool = S.cool || {}; S.cool[code] = Date.now() + 5000;
    try { S.scanner.resume(); } catch (e) {}
  };
  bg.querySelector('#cRetry').onclick = close;
  bg.querySelector('#cSave').onclick = async () => {
    const item = { id: Date.now() + '_' + code, order: code, raw: String(raw).slice(0, 300), reads, photo: shot.full, thumb: shot.thumb,
      time: new Date().toISOString(), device: navigator.userAgent.slice(0, 120) };
    // Cap nhat ngay tren man hinh
    const nowTxt = new Date().toLocaleTimeString('vi-VN');
    S.thumbs['local_' + item.id] = shot.thumb;
    if (kind === 'ok') d.checked[code] = { time: nowTxt, by: S.user.ten, thumb: 'local_' + item.id, photo: '', local: true };
    if (kind === 'bad' && !d.extra.some(x => x.order === code)) d.extra.push({ order: code, time: nowTxt, by: S.user.ten, thumb: 'local_' + item.id });
    close(); renderStats();
    await Q.add(item);
    flush();
  };
}
let flushing = false;
async function flush() {
  if (flushing || !S.token) return;
  flushing = true;
  try {
    const items = await Q.all();
    setPending(items.length);
    for (const it of items) {
      if (!navigator.onLine) break;
      try {
        const r = await api('scan', it);
        await Q.del(it.id);
        const d = S.data;
        if (d && r.result === 'Đúng danh sách') d.checked[r.order] = { time: r.time, by: S.user.ten, thumb: r.thumb, photo: r.photo };
        if (d && r.result === 'Ngoài danh sách') { const x = d.extra.find(e => e.order === r.order); if (x) { x.thumb = r.thumb; x.photo = r.photo; } }
        S.thumbs[r.thumb] = it.thumb;
        S.report = null;
        if (r.note) toast(r.note, 6000);
      } catch (e) {
        if (e.auth) { onApiError(e); break; }
        if (/không hợp lệ|Thiếu ảnh/.test(e.message)) { await Q.del(it.id); toast('Bỏ ' + it.order + ': ' + e.message); continue; }
        break; // loi mang: giu lai, thu sau
      }
    }
    setPending((await Q.all()).length);
    if (S.tab === 'scan') renderStats(); else if (S.tab === 'list') renderList();
  } finally { flushing = false; }
}
setInterval(flush, 10000);
window.addEventListener('online', flush);
document.addEventListener('visibilitychange', () => { if (document.hidden) stopScan(); else if (S.token) loadList(true); });

let actx = null;
function beep(kind) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const tone = (f, t0, len) => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; g.gain.value = .13;
      o.connect(g); g.connect(actx.destination); o.start(actx.currentTime + t0); o.stop(actx.currentTime + t0 + len); };
    if (kind === 'read') tone(1400, 0, .05);
    if (kind === 'ok') { tone(1050, .08, .12); }
    if (kind === 'dup') { tone(760, .08, .1); tone(760, .25, .1); }
    if (kind === 'bad') { tone(300, .08, .45); }
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(kind === 'ok' ? 70 : kind === 'dup' ? [50, 70, 50] : kind === 'bad' ? [250, 90, 250] : 15);
}

async function loadThumbs() {
  const els = Array.from(document.querySelectorAll('[data-thumb]'));
  const need = [];
  els.forEach(el => { const id = el.dataset.thumb; if (!id) return; if (S.thumbs[id]) el.style.backgroundImage = `url("${S.thumbs[id]}")`; else if (!id.startsWith('local_') && need.indexOf(id) < 0) need.push(id); });
  for (let i = 0; i < need.length; i += 30) {
    try {
      const r = await api('photo', { ids: need.slice(i, i + 30) });
      Object.assign(S.thumbs, r.photos);
      els.forEach(el => { const u = S.thumbs[el.dataset.thumb]; if (u) el.style.backgroundImage = `url("${u}")`; });
    } catch (e) { break; }
  }
}

const GROUPS = [['hub', 'Bưu cục'], ['driver', 'NV giao'], ['checker', 'Người kiểm'], ['am', 'AM'], ['day', 'Ngày']];
function viewReport() {
  const p = S.rep;
  $('#view').innerHTML = `<div class="card">
      <div class="row" style="margin-bottom:10px"><div class="field" style="flex:1;margin:0"><label>Từ ngày</label><input type="date" id="rFrom" value="${p.from}"></div>
        <div class="field" style="flex:1;margin:0"><label>Đến ngày</label><input type="date" id="rTo" value="${p.to}"></div></div>
      <div class="chips" style="margin-bottom:8px">${[['Hôm nay', 0, 0], ['Hôm qua', 1, 1], ['7 ngày', 6, 0], ['30 ngày', 29, 0]].map(x =>
        `<button class="chip" data-q="${x[1]},${x[2]}">${x[0]}</button>`).join('')}</div>
      <div class="field" style="margin-bottom:10px"><label>Bưu cục</label><select id="rHub"><option value="">Tất cả trong phạm vi</option></select></div>
      <button class="btn primary block" id="rRun">Xem báo cáo</button></div>
    <div id="rOut"></div>`;
  const setQ = (a, b) => { const d = n => { const x = new Date(); x.setDate(x.getDate() - n); x.setMinutes(x.getMinutes() - x.getTimezoneOffset()); return x.toISOString().slice(0, 10); };
    $('#rFrom').value = d(a); $('#rTo').value = d(b); runReport(); };
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => { const v = b.dataset.q.split(','); setQ(+v[0], +v[1]); });
  $('#rRun').onclick = runReport;
  runReport(); // luon tong hop lai khi vao tab (khong dung ket qua cu)
}
function fillHubs(hubs) {
  const sel = $('#rHub'); if (!sel || sel.options.length > 1) return;
  (hubs || []).forEach(h => { const o = document.createElement('option'); o.value = h.code; o.textContent = h.code + (h.name ? ' - ' + h.name : ''); sel.appendChild(o); });
  sel.value = S.rep.hub;
}
async function runReport() {
  S.rep.from = $('#rFrom').value; S.rep.to = $('#rTo').value;
  if ($('#rHub').options.length > 1) S.rep.hub = $('#rHub').value; // giu bo loc buu cuc khi vao lai tab
  $('#rOut').innerHTML = loader('Đang tổng hợp báo cáo', 10);
  try {
    S.report = await api('report', { from: isoToVN(S.rep.from), to: isoToVN(S.rep.to), hub: S.rep.hub });
    fillHubs(S.report.hubs); renderReport();
  } catch (e) { $('#rOut').innerHTML = ''; onApiError(e); }
}
function renderReport() {
  const r = S.report, p = S.rep, t = r.total; if (!$('#rOut')) return;
  const rate = t.need ? Math.round(t.done / t.need * 1000) / 10 : 0;
  const rows = r.groups.filter(g => g.kind === p.group)
    .sort((a, b) => p.group === 'day' ? String(b.key).split('/').reverse().join('').localeCompare(String(a.key).split('/').reverse().join('')) :
      p.group === 'checker' ? (b.extra + b.rescan) - (a.extra + a.rescan) || b.done - a.done : b.miss - a.miss || b.codMiss - a.codMiss);
  const isChk = p.group === 'checker';
  const det = p.filter === 'bad' ? r.extras : r.details.filter(d => p.filter === 'all' || (p.filter === 'ok' ? d.done : !d.done));
  $('#rOut').innerHTML = `
    <div class="h2">Kết quả ${esc(r.from)}${r.to !== r.from ? ' → ' + esc(r.to) : ''}<button class="btn light" id="rCsv" style="height:34px;padding:0 10px">${svg('dl')}Excel</button></div>
    <div class="kpis">
      <div class="kpi"><span>Cần kiểm</span><b class="num">${t.need}</b></div>
      <div class="kpi ok"><span>Đã kiểm · ${rate}%</span><b class="num">${t.done}</b></div>
      <div class="kpi miss"><span>Còn thiếu</span><b class="num">${t.miss}</b></div>
      <div class="kpi miss"><span>COD còn thiếu</span><b class="num">${money(t.codMiss)}</b></div></div>
    <div class="seg" style="margin-bottom:10px">${GROUPS.map(g => `<button data-g="${g[0]}" class="${p.group === g[0] ? 'on' : ''}">${g[1]}</button>`).join('')}</div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>${GROUPS.find(g => g[0] === p.group)[1]}</th>
      ${isChk ? '<th>Kiểm đúng</th><th>Ngoài DS</th><th>Quét lại</th>' : '<th>Cần</th><th>Đã kiểm</th><th>Thiếu</th><th>Tỉ lệ</th><th>COD thiếu</th><th>Quét lại</th>'}</tr></thead>
      <tbody>${rows.map(g => `<tr class="${!isChk && g.miss ? 'hl' : ''}"><td><div class="nm">${esc(g.name || g.key)}</div>${g.name && g.name !== g.key ? `<div class="k">${esc(g.key)}</div>` : ''}${!isChk && g.checkers ? `<div class="k">Kiểm: ${esc(g.checkers)}</div>` : ''}</td>
        ${isChk ? `<td class="num">${g.done}</td><td class="num">${g.extra}</td><td class="num">${g.rescan}</td>` :
        `<td class="num">${g.need}</td><td class="num">${g.done}</td><td class="num"><b>${g.miss}</b></td><td class="num">${g.rate === null ? '' : g.rate + '%'}</td><td class="num">${money(g.codMiss)}</td><td class="num">${g.rescan}</td>`}</tr>`).join('') ||
        '<tr><td colspan="7" class="empty">Không có dữ liệu</td></tr>'}</tbody></table></div>
    <button class="dettog" id="rDet"><span>Chi tiết đơn <small>· ${det.length} đơn</small></span><span>${p.showDet ? 'Thu gọn ▲' : 'Xem ▼'}</span></button>
    ${p.showDet ? `<div class="chips">${[['miss', 'Còn thiếu'], ['ok', 'Đã kiểm (có ảnh)'], ['bad', 'Ngoài DS'], ['all', 'Tất cả']].map(x =>
      `<button class="chip${p.filter === x[0] ? ' on' : ''}" data-f="${x[0]}">${x[1]}</button>`).join('')}</div>
    <div>${det.slice(0, 400).map(d => { const kind = p.filter === 'bad' ? 'bad' : d.done ? 'ok' : 'miss';
      return `<div class="order ${kind}">${d.thumb ? `<div class="thumb click" data-thumb="${esc(d.thumb)}" data-photo="${esc(d.photo)}" data-cap="${esc(d.order + ' · ' + d.day + ' ' + (d.time || '') + ' · ' + (d.by || ''))}"></div>` : ''}
        <div class="body"><div class="o1"><span class="ocode">${esc(d.order)}</span>${d.cod ? `<span class="cod num">${money(d.cod)} đ</span>` : ''}</div>
        <div class="sub">${esc(d.day)} · BC ${esc(d.hub)}${d.driverName ? ' · NV giao: ' + esc(d.driverName) : ''}</div>
        ${d.status ? `<div class="sub" style="margin-top:4px">${stTag(d.status)}</div>` : ''}
        <span class="tag ${kind}">${kind === 'ok' ? 'Đã kiểm ' + esc(d.time) + ' · ' + esc(d.by) : kind === 'bad' ? 'Ngoài DS · ' + esc(d.time) + ' · ' + esc(d.by) : 'Chưa thấy trong kho'}</span>
        ${d.rescan ? ` <span class="tag dup">Quét lại ${d.rescan} lần</span>` : ''}</div></div>`; }).join('') || '<div class="empty">Không có đơn nào</div>'}
      ${det.length > 400 ? '<div class="hint" style="text-align:center">Hiển thị 400 đơn đầu, tải CSV để xem đủ</div>' : ''}</div>` : ''}`;
  $('#rDet').onclick = () => { S.rep.showDet = !S.rep.showDet; renderReport(); };
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { S.rep.group = b.dataset.g; renderReport(); });
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { S.rep.filter = b.dataset.f; renderReport(); });
  $('#rCsv').onclick = exportXlsx;
  loadThumbs();
}
// Xuat file Excel (.xlsx) nhieu sheet. Thu vien SheetJS chi tai khi bam nut.
function loadXlsxLib() {
  if (window.XLSX) return Promise.resolve();
  // Kem trong repo (cung domain); trang chay tu Apps Script thi lay tu GitHub Pages, cuoi cung la CDN
  const srcs = (GAS ? ['https://quynh2011.github.io/kiemke-cod/xlsx.full.min.js'] : ['xlsx.full.min.js'])
    .concat(['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js']);
  const one = src => new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = src;
    sc.onload = () => window.XLSX ? ok() : no(); sc.onerror = () => { sc.remove(); no(); }; document.head.appendChild(sc); });
  return srcs.reduce((p, src) => p.catch(() => one(src)), Promise.reject())
    .catch(() => { throw new Error('Không tải được thư viện Excel, kiểm tra mạng'); });
}
async function exportXlsx() {
  const r = S.report; if (!r) return;
  const btn = $('#rCsv'); btn.disabled = true; busy(1);
  try {
    await loadXlsxLib();
    const wb = XLSX.utils.book_new();
    const add = (name, rows, widths) => {
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = widths.map(w => ({ wch: w }));
      // Dinh dang so: cot tien -> #,##0 ; cot ti le -> 0.0%
      rows[0].forEach((h, c) => {
        const z = /COD|Giá trị/.test(h) ? '#,##0' : /Tỉ lệ/.test(h) ? '0.0%' : '';
        if (z) for (let r = 1; r < rows.length; r++) { const cell = ws[XLSX.utils.encode_cell({ r, c })];
          if (cell && cell.t === 'n') cell.z = /Tỉ lệ/.test(rows[r][0]) ? '0.0%' : z; }
      });
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(0, rows.length - 1), c: rows[0].length - 1 } }) };
      ws['!freeze'] = { xSplit: 0, ySplit: 1 };
      XLSX.utils.book_append_sheet(wb, ws, name);
    };
    const t = r.total;
    add('Tổng quan', [['Chỉ tiêu', 'Giá trị'], ['Từ ngày', r.from], ['Đến ngày', r.to], ['Cần kiểm', t.need], ['Đã kiểm', t.done], ['Còn thiếu', t.miss],
      ['Tỉ lệ đã kiểm', t.need ? t.done / t.need : 0], ['COD còn thiếu', t.codMiss], ['Ngoài danh sách', t.extra]], [22, 18]);
    GROUPS.forEach(g => {
      const rows = r.groups.filter(x => x.kind === g[0]);
      if (!rows.length) return;
      const chk = g[0] === 'checker';
      add('Theo ' + g[1], [chk ? [g[1], 'Mã', 'Kiểm đúng', 'Ngoài DS', 'Quét lại'] : [g[1], 'Mã', 'Cần kiểm', 'Đã kiểm', 'Còn thiếu', 'Tỉ lệ', 'COD thiếu', 'Quét lại', 'Người kiểm']]
        .concat(rows.map(x => chk ? [x.name || x.key, x.key, x.done, x.extra, x.rescan]
          : [x.name || x.key, x.key, x.need, x.done, x.miss, x.rate === null ? '' : x.rate / 100, x.codMiss, x.rescan, x.checkers || ''])),
        chk ? [28, 12, 11, 11, 10] : [28, 12, 10, 10, 10, 8, 14, 9, 30]);
    });
    add('Chi tiết đơn', [['Ngày', 'Bưu cục', 'Mã đơn', 'COD', 'Mã NV giao', 'Tên NV giao', 'Trạng thái', 'Kết quả', 'Giờ kiểm', 'Người kiểm', 'Quét lại']]
      .concat(r.details.map(d => [d.day, d.hub, d.order, d.cod, d.driverId, d.driverName, d.status, d.done ? 'Đã kiểm' : 'Còn thiếu', d.time, d.by, d.rescan || 0])),
      [11, 10, 16, 13, 11, 24, 16, 11, 18, 22, 8]);
    if (r.extras.length) add('Ngoài DS', [['Ngày', 'Bưu cục', 'Mã đơn', 'Giờ quét', 'Người quét']]
      .concat(r.extras.map(x => [x.day, x.hub, x.order, x.time, x.by])), [11, 10, 16, 18, 22]);
    XLSX.writeFile(wb, 'KiemKe_' + r.from.replace(/\//g, '-') + (r.to !== r.from ? '_' + r.to.replace(/\//g, '-') : '') + '.xlsx');
    toast('Đã tải file Excel');
  } catch (e) { toast(e.message, 5000); }
  finally { btn.disabled = false; busy(-1); }
}
function exportCsv() {
  const r = S.report;
  const cols = ['Ngày', 'Bưu cục', 'Mã đơn', 'COD', 'Mã NV giao', 'Tên NV giao', 'Mã chuyến', 'Trạng thái', 'Kết quả', 'Giờ kiểm', 'Người kiểm', 'Quét lại'];
  const lines = [cols].concat(r.details.map(d => [d.day, d.hub, d.order, d.cod, d.driverId, d.driverName, d.trip, d.status,
    d.done ? 'Đã kiểm' : 'Còn thiếu', d.time, d.by, d.rescan])).concat(r.extras.map(x => [x.day, x.hub, x.order, '', '', '', '', '', 'Ngoài danh sách', x.time, x.by, '']));
  const csv = '﻿' + lines.map(l => l.map(v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'KiemKe_' + r.from.replace(/\//g, '-') + '_' + r.to.replace(/\//g, '-') + '.csv'; a.click();
}

async function viewAdmin() {

    <div class="card" style="font-size:13px;color:var(--ink-2)"><b style="color:var(--ink)">Tài khoản nhân viên</b><br>

      `<div class="thumb click" data-thumb="${esc(u.selfie)}" data-photo="${esc(u.selfie)}" data-cap="${esc('Ảnh xác minh · ' + u.ma + ' ' + u.ten + ' · ' + (u.authAt || ''))}" title="Ảnh xác minh khuôn mặt"></div>` : ''}<div class="body">

      <div style="margin-top:5px;display:flex;gap:6px;flex-wrap:wrap">${u.status === 'Khoá' ? '<span class="tag miss">Đã khoá</span>' : ''}

    bg.querySelector('#uHubBox').hidden = r === 'NV' || r === 'QUAN_LY' || r === 'TU_DONG'; };
  bg.querySelector('#uRole').onchange = upd; upd();
  bg.querySelector('#uHubQ').oninput = e => { const q = e.target.value.toUpperCase(); bg.querySelectorAll('#uHubs label').forEach(l => { l.hidden = q && l.dataset.h.indexOf(q) < 0; }); };
  bg.querySelector('#uCancel').onclick = () => bg.remove();
  bg.querySelector('#uf').onsubmit = async e => {
    e.preventDefault();
    const role = bg.querySelector('#uRole').value;
    const hubs = role === 'NV' || role === 'QUAN_LY' || role === 'TU_DONG' ? [] : Array.from(bg.querySelectorAll('#uHubs input:checked')).map(i => i.value);
    const reset = bg.querySelector('#uReset');
    bg.querySelector('#uSave').disabled = true; bg.querySelector('#uErr').textContent = 'Đang lưu…';
    try {
      const r = await api('saveUser', { ma: bg.querySelector('#uMa').value.trim(), ten: bg.querySelector('#uTen').value.trim(), role, hubs,
        status, resetAuth: !!(reset && reset.checked) });
      bg.remove(); toast(r.created ? 'Đã tạo tài khoản' : 'Đã cập nhật'); viewAdmin();
    } catch (err) { bg.querySelector('#uErr').textContent = err.message; bg.querySelector('#uSave').disabled = false; }
  };
}

// =====================================================================
// TRANG TAI KHOAN
// =====================================================================
function viewMe() {
  const u = S.user;
  $('#view').innerHTML = `<div class="card"><div class="h2" style="margin-top:0">${esc(u.ten)}</div>
      <div class="sub">Mã NV ${esc(u.ma)} · ${esc(u.roleVN)}</div>
      <div class="sub" style="margin-top:6px">${u.all ? 'Phạm vi: <b>tất cả bưu cục</b>' : u.role === 'NV' ? 'Phạm vi: <b>đơn do mình giao</b>' :
        'Phạm vi bưu cục: <b>' + esc(u.hubs.join(', ') || 'chưa có') + '</b>'}</div></div>
    <div class="card"><div class="h2" style="margin-top:0">Bảo mật đăng nhập</div>
      <div style="display:flex;gap:12px;align-items:center">${u.selfie ? `<div class="selfthumb thumb click" data-thumb="${esc(u.selfie)}" data-photo="${esc(u.selfie)}" data-cap="${esc('Ảnh xác minh · ' + u.ma + ' · ' + (u.authAt || ''))}"></div>` : ''}
        <div class="sub" style="color:var(--ink)">Đăng nhập bằng <b>Authenticator</b> (mã 6 số)${u.authAt ? '<br><span style="color:var(--ink-2)">Kích hoạt lúc ' + esc(u.authAt) + '</span>' : ''}</div></div>
      <div class="hint" style="margin-top:10px">Đổi điện thoại hoặc mất app Authenticator: nhờ quản lý bấm <b>Đặt lại Authenticator</b>, rồi kích hoạt lại (có quay khuôn mặt).</div></div>
    <button class="btn light block" id="bOut">Đăng xuất</button>
    <div class="hint" style="text-align:center;margin-top:14px">${DEMO ? 'Chế độ thử · ' : ''}Kiểm kê COD v2</div>`;
  $('#bOut').onclick = logout;
  loadThumbs();
}

// =====================================================================
// KHOI DONG
// =====================================================================
if (qs.get('api')) history.replaceState(null, '', location.pathname + (qs.get('demo') ? '?demo=1' : ''));
if (S.token && S.user) { shell(); loadList(); flush(); } else viewLogin();
})();
</script>
